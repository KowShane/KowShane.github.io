<!-- Form/Contact allowing users to send a message -->
 <main class="contact-page container" role="main">
<form action="/my-handling-form-page" method="post">
  <h1>Contact Me</h1>
           
 <fieldset>
     <legend>Send a Message</legend> 
    <p>
     <label for="Name">Name:</label>
     <input type="text" id="name" name="name" maxlength="100"> 
     </p>
   
   <p>                
     <label for="Email">Email:</label>
     <span class="wrap">
     <input type="email" id="email" name="email" maxlength="100" required> 
     <span></span>
     </span>
   </p>
   
   <p>
    <label for="sign">Astrological Sign:</label>
    <select class="retro" id="sign" name="sign" required>
      <option value="">Select your sign</option>
      <option value="aries">Aries</option>
      <option value="taurus">Taurus</option>
      <option value="gemini">Gemini</option>
      <option value="cancer">Cancer</option>
      <option value="leo">Leo</option>
      <option value="virgo">Virgo</option>
      <option value="libra">Libra</option>
      <option value="scorpio">Scorpio</option>
      <option value="sagittarius">Sagittarius</option>
      <option value="capricorn">Capricorn</option>
      <option value="aquarius">Aquarius</option>
      <option value="pisces">Pisces</option>
      </p>
   </select>
    <p class="button">
      <label for="msg">Message:</label>
      <textarea id="msg" name="user-message" rows="5" cols="40" placeholder="What's on your mind?"></textarea>
    </p>
   <button class="retro" type="submit">Send Message</button>
  </fieldset>           
</form>
</main>
